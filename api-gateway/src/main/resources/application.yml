server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: vehiculos-service
              uri: ${VEHICULOS_URL:http://localhost:8081}
              predicates:
                - Path=/vehiculos/**
            - id: mantenimiento-service
              uri: ${MANTENIMIENTO_URL:http://localhost:8082}
              predicates:
                - Path=/alertas/**